name: Build with Grunt

on:
  workflow_dispatch:
    # Désactivé par défaut - activer manuellement si nécessaire

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Grunt CLI globally
      run: npm install -g grunt-cli

    - name: Install Grunt locally
      run: npm install --save-dev grunt

    - name: Check if Gruntfile.js exists
      id: check_gruntfile
      run: |
        if [ -f Gruntfile.js ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "⚠️ Gruntfile.js not found. This workflow requires a Gruntfile.js to run."
        fi

    - name: Install Grunt plugins
      if: steps.check_gruntfile.outputs.exists == 'true'
      run: npm install --save-dev grunt-contrib-clean grunt-contrib-copy

    - name: Run Grunt build
      if: steps.check_gruntfile.outputs.exists == 'true'
      run: grunt

    - name: Upload build artifacts
      if: steps.check_gruntfile.outputs.exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: grunt-build-${{ matrix.node-version }}
        path: dist/
        retention-days: 7

