name: Build with Webpack

on:
  workflow_dispatch:
    # Désactivé par défaut - activer manuellement si nécessaire

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Webpack and CLI
      run: |
        npm install --save-dev webpack webpack-cli

    - name: Check if webpack.config.js exists
      id: check_webpack
      run: |
        if [ -f webpack.config.js ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "⚠️ webpack.config.js not found. This workflow requires a webpack.config.js to run."
        fi

    - name: Run Webpack build
      if: steps.check_webpack.outputs.exists == 'true'
      run: npx webpack --mode production

    - name: Upload build artifacts
      if: steps.check_webpack.outputs.exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: webpack-build-${{ matrix.node-version }}
        path: dist/
        retention-days: 7

