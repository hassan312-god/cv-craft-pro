name: Build with Gulp

on:
  workflow_dispatch:
    # Désactivé par défaut - activer manuellement si nécessaire

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Gulp CLI globally
      run: npm install -g gulp-cli

    - name: Install Gulp locally
      run: npm install --save-dev gulp

    - name: Check if gulpfile.js exists
      id: check_gulpfile
      run: |
        if [ -f gulpfile.js ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "⚠️ gulpfile.js not found. This workflow requires a gulpfile.js to run."
        fi

    - name: Run Gulp build
      if: steps.check_gulpfile.outputs.exists == 'true'
      run: gulp build

    - name: Upload build artifacts
      if: steps.check_gulpfile.outputs.exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: gulp-build-${{ matrix.node-version }}
        path: dist/
        retention-days: 7

